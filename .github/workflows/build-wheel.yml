name: build
on:
  workflow_dispatch:

permissions:
  packages: write
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  pre-check:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      git_sha: ${{ steps.check.outputs.git_sha }}
      image_tag: ${{ steps.check.outputs.image_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install crane
        uses: imjasonh/setup-crane@v0

      - name: Check image exists
        id: check
        run: |
          GIT_SHA=$(git rev-parse --short HEAD)
          IMAGE_LOWER=$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_TAG="${{ env.REGISTRY }}/${IMAGE_LOWER}:sha-${GIT_SHA}"
          echo "GIT_SHA=${GIT_SHA}"
          echo "IMAGE_TAG=${IMAGE_TAG}"

          if crane manifest "${IMAGE_TAG}" >/dev/null 2>&1; then
            echo "✅ Image already exists, skip build"
            SHOULD_BUILD="false"
          else
            echo "🆕 Image not found, proceed build"
            SHOULD_BUILD="true"
          fi

          {
            echo "should_build=${SHOULD_BUILD}"
            echo "git_sha=${GIT_SHA}"
            echo "image_tag=${IMAGE_TAG}"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: pre-check
    if: needs.pre-check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full source code (fork local code)
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare meta
        id: meta
        run: |
          GIT_SHA="${{ needs.pre-check.outputs.git_sha }}"
          IMAGE_LOWER=$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          {
            echo "repo=${{ env.REGISTRY }}/${IMAGE_LOWER}"
            echo "sha_tag=sha-${GIT_SHA}"
          } >> "$GITHUB_OUTPUT"

      - name: Build & Push (compile wheel inside docker container)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.repo }}:${{ steps.meta.outputs.sha_tag }}
            ${{ steps.meta.outputs.repo }}:latest
          build-args: |
            GIT_SHA=${{ needs.pre-check.outputs.git_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Workflow summary
        run: |
          GIT_SHA="${{ needs.pre-check.outputs.git_sha }}"
          REPO="${{ steps.meta.outputs.repo }}"
          SHA_TAG="${{ steps.meta.outputs.sha_tag }}"
          {
            echo "### Docker Image Build Complete"
            echo ""
            echo "Commit SHA: \`${GIT_SHA}\`"
            echo "Image: \`${REPO}:${SHA_TAG}\`"
            echo "Latest tag: \`${REPO}:latest\`"
          } >> "$GITHUB_STEP_SUMMARY"
