name: build
on:
  workflow_dispatch:
    inputs:
      ref:
        description: '1Cat-vLLM branch / tag / commit to build from (e.g. main, v1.5.0, a1b2c3d). Leave empty for main.'
        required: false
        default: 'main'
        type: string
      image_tag:
        description: 'Docker image tag (e.g. v1.5.0). Leave empty to auto-detect from git tag.'
        required: false
        type: string
permissions:
  packages: write
  contents: read
  actions: write
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  VLLM_REPO: abcd19886/1Cat-vLLM
jobs:
  check-and-build:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      version_tag: ${{ steps.check.outputs.version_tag }}
      vllm_commit: ${{ steps.check.outputs.vllm_commit }}
    steps:
      - name: Checkout 1Cat-vLLM source
        uses: actions/checkout@v4
        with:
          repository: abcd19886/1Cat-vLLM
          ref: ${{ inputs.ref }}
          submodules: true
          fetch-depth: 0
      - name: Determine version & check image
        id: check
        run: |
          COMMIT=$(git rev-parse --short HEAD)
          echo "1Cat-vLLM commit: ${COMMIT}"
          if [ -n "${{ inputs.image_tag }}" ]; then
            VERSION="${{ inputs.image_tag }}"
          else
            VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "dev-${COMMIT}")
          fi
          echo "Image tag: ${VERSION}"
          IMAGE_TAG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION}"
          echo "Checking if ${IMAGE_TAG} already exists..."
          RESPONSE=$(curl -sL -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://ghcr.io/v2/$(echo ${{ env.IMAGE_NAME }} | tr '[:upper:]' '[:lower:]')/manifests/${VERSION}" \
            -H "Accept: application/vnd.oci.image.manifest.v1+json" 2>/dev/null || echo "000")
          if [ "$RESPONSE" = "200" ] || [ "$RESPONSE" = "401" ]; then
            TOKEN=$(curl -sL "https://ghcr.io/token?scope=repository:${{ env.IMAGE_NAME }}:pull" \
              | python3 -c "import sys,json; print(json.load(sys.stdin).get('token',''))" 2>/dev/null)
            if [ -n "$TOKEN" ]; then
              RESPONSE=$(curl -sL -o /dev/null -w "%{http_code}" \
                -H "Authorization: Bearer $TOKEN" \
                -H "Accept: application/vnd.oci.image.manifest.v1+json" \
                "https://ghcr.io/v2/$(echo ${{ env.IMAGE_NAME }} | tr '[:upper:]' '[:lower:]')/manifests/${VERSION}" 2>/dev/null || echo "000")
            fi
          fi
          if [ "$RESPONSE" = "200" ]; then
            echo "Image ${IMAGE_TAG} already exists. Skipping build."
            echo "should_build=false" >> $GITHUB_OUTPUT
          else
            echo "Image ${IMAGE_TAG} does not exist. Will build from source."
            echo "should_build=true" >> $GITHUB_OUTPUT
          fi
          echo "version_tag=${VERSION}" >> $GITHUB_OUTPUT
          echo "vllm_commit=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

  build:
    needs: check-and-build
    if: needs.check-and-build.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main repo
        uses: actions/checkout@v4
      - name: Checkout 1Cat-vLLM source
        uses: actions/checkout@v4
        with:
          repository: abcd19886/1Cat-vLLM
          ref: ${{ needs.check-and-build.outputs.vllm_commit }}
          path: vllm-source
      - name: Git submodule init
        run: |
          cd vllm-source
          git submodule sync
          git submodule update --init --recursive

      - name: Enable swap memory
        run: |
          SWAP_PATH=/home/runner/swap8g
          rm -f ${SWAP_PATH}
          if ! sudo fallocate -l 8G ${SWAP_PATH}; then
            echo "fallocate failed, using dd fallback"
            sudo dd if=/dev/zero of=${SWAP_PATH} bs=1G count=8 status=none
          fi
          sudo chmod 600 ${SWAP_PATH}
          sudo mkswap ${SWAP_PATH}
          sudo swapon ${SWAP_PATH}
          swapon --show

      - name: Free disk space
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo apt clean
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        run: |
          VERSION="${{ needs.check-and-build.outputs.version_tag }}"
          IMAGE_LOWER=$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          echo "image=${{ env.REGISTRY }}/${IMAGE_LOWER}" >> $GITHUB_OUTPUT
          echo "tag=${VERSION}" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          # no-cache: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          # mode=max (not min): export the cache even when the build fails,
          # so sccache-compiled objects from finished steps survive a later
          # packaging failure and are reused by the next build.
          cache-to: type=gha,mode=max
          # NOTE: do NOT wrap the value in quotes. docker/build-push-action
          # passes build-arg values verbatim, so `TORCH_CUDA_ARCH_LIST="7.0"`
          # would leak literal quote characters into the env var and make
          # PyTorch's CMake arch parser fail with
          # "Found Unknown CUDA Architecture Name: \"7.0\"".
          # NOTE: the Dockerfile currently pins SM70 (TORCH_CUDA_ARCH_LIST=7.0
          # and CMAKE_CUDA_ARCHITECTURES=70) in both build paths, so this arg
          # is informational until the Dockerfile is changed.
          # USE_SCCACHE=1 enables sccache; SCCACHE_BUCKET_NAME= (empty)
          # disables the S3 remote cache so the BuildKit cache mount (persisted
          # via cache-to: type=gha) is the only cache backend.
          build-args: |
            TORCH_CUDA_ARCH_LIST=7.0;9.0
            USE_SCCACHE=1
            SCCACHE_BUCKET_NAME=

      - name: Summary
        run: |
          echo "### Docker Image Built (from source)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Image: \`${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "Also tagged: \`${{ steps.meta.outputs.image }}:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "1Cat-vLLM: https://github.com/abcd19886/1Cat-vLLM @ \`${{ needs.check-and-build.outputs.vllm_commit }}\`" >> $GITHUB_STEP_SUMMARY
